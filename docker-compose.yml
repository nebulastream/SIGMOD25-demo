services:
  # Worker has to run outside the docker container, as it requries access to the host network

  # audio source
  mic-stream:
    build:
      context: mic-server
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}

    # run as your host user so you can access the socket:
    user: "${HOST_UID}:${HOST_GID}"

    # map in the sound card:
    devices:
      - /dev/snd:/dev/snd

    # mount the Pulse/pipewire socket read-only:
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse/native:/run/pulse/native:ro

    # publish the raw‑PCM TCP port:
    ports:
      - "1234:1234"

    environment:
      # tell all clients where the socket lives:
      PULSE_SERVER: unix:/run/pulse/native

      # pick up the discovered mic source:
      SOURCE: ${PULSE_SOURCE}

      # for faster data ingestion
      PULSE_LATENCY_MSEC: "20"

    # on startup, stream your mic out on TCP 1234
    command: >
       sh -c "parec --format=s16le --rate=16000 --channels=1 --device=$$SOURCE |
             socat -u - TCP-LISTEN:1234,reuseaddr,fork"

  # patient monitor ECG signal (replay)
  pm-signal:
    container_name: pm-signal
    build:
      context: patient-monitor/replay
      #image: patientMonitorReplay

  # lab values (replay)
  lab-values-replay:
    container_name: lab-values
    build:
      context: lab-values/replay

  # Queries:
  audio-s2s:
    build:
      context: query-coordinator
      dockerfile: Dockerfile.nebuli
    extra_hosts:
      - "nes:host-gateway"
    volumes:
      - ./queries:/queries
      - ./model:/model
    command: ["queries/audio_s2s.yaml"]

  record-video:
    build:
      context: query-coordinator
      dockerfile: Dockerfile.nebuli
    extra_hosts:
      - "nes:host-gateway"
    volumes:
      - ./queries:/queries
      - ./model:/model
    command: ["queries/record-video.yml"]

  rgb-and-thermal:
    build:
      context: query-coordinator
      dockerfile: Dockerfile.nebuli
    extra_hosts:
      - "nes:host-gateway"
    volumes:
      - ./queries:/queries
      - ./model:/model
    command: ["queries/rgb-and-thermal.yaml"]

  speech-recognition:
