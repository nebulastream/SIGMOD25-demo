services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-n", "-t", "test", "--quiet" ]
    ports:
      - "1883:1883"
      - "9001:9001"
    command: |
      sh -c '
      cat > /mosquitto/config/mosquitto.conf <<EOF
      persistence true
      persistence_location /mosquitto/data/
      log_dest file /mosquitto/log/mosquitto.log
      log_type all

      listener 1883
      protocol mqtt
      allow_anonymous true

      listener 9001
      protocol websockets
      allow_anonymous true
      EOF

      mosquitto -c /mosquitto/config/mosquitto.conf
      '

  # nebulastream worker
  nes:
    container_name: nes
    healthcheck:
      test: [ "CMD-SHELL", "/bin/grpc_health_probe", '-addr', 'localhost:8080' ]
    image: nebulastream/worker:video-demo #worker-local

  # audio source
  mic-stream:
    build:
      context: mic-server
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}

    # run as your host user so you can access the socket:
    user: "${HOST_UID}:${HOST_GID}"

    # map in the sound card:
    devices:
      - /dev/snd:/dev/snd

    # mount the Pulse/pipewire socket read-only:
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse/native:/run/pulse/native:ro

    # publish the raw‑PCM TCP port:
    ports:
      - "1234:1234"

    environment:
      # tell all clients where the socket lives:
      PULSE_SERVER: unix:/run/pulse/native

      # pick up the discovered mic source:
      SOURCE: ${PULSE_SOURCE}

      # for faster data ingestion
      PULSE_LATENCY_MSEC: "20"

    # on startup, stream your mic out on TCP 1234
    command: >
       sh -c "parec --format=s16le --rate=16000 --channels=1 --device=$$SOURCE |
             socat -u - TCP-LISTEN:1234,reuseaddr,fork"

  # patient monitor ECG signal (replay)
  pm-signal:
    container_name: pm-signal
    build:
      context: patient-monitor/replay
    depends_on:
      - nes
      - mosquitto
      #image: patientMonitorReplay

  # lab values (replay)
  lab-values-replay:
    container_name: lab-values
    build:
      context: lab-values/replay
    depends_on:
      - nes
      - mosquitto
  
  dashboard:
    image: nebulastream/needmi-demo-ui:latest
    depends_on:
      - mosquitto
    ports:
      - 3001:3000
