  patient-monitor-start-request:
    image: curlimages/curl:latest
    environment:
      - JUMP_HOST=${JUMP_HOST}
      - USB_DEV=${USB_DEV}
      - LOCAL_IP=${LOCAL_IP}
    entrypoint: /bin/sh
    command: >
      -c '
      curl -X POST http://$JUMP_HOST:5000/start-script
      -H "X-USB-DEV: $USB_DEV"
      -H "Content-Type: application/json"
      -d @- <<EOF
      {
        "log_level": "INFO",
        "signals": [
          {
            "signal": "PLS",
            "transfer_protocol": "mqtt",
            "mqtt_broker": "$LOCAL_IP",
            "mqtt_port": 1883,
            "mqtt_keepalive": 60,
            "mqtt_format": "json",
            "mqtt_topic": "patientMonitor"
          },
          {
            "signal": "SPO2",
            "transfer_protocol": "mqtt",
            "mqtt_broker": "$LOCAL_IP",
            "mqtt_port": 4000,
            "mqtt_keepalive": 60,
            "mqtt_format": "csv",
            "mqtt_topic": "patientMonitor"
          }
        ]
      }
      EOF
      '
