services:
  # Worker has to run outside the docker container, as it requries access to the host network

  # audio source
  mic-stream:
    build:
      context: mic-server
      args:
        HOST_UID: 1000 #${HOST_UID}
        HOST_GID: 1000 #${HOST_GID}

    # run as your host user so you can access the socket:
    user: "${HOST_UID}:${HOST_GID}"

    # map in the sound card:
    devices:
      - /dev/snd:/dev/snd

    # mount the Pulse/pipewire socket read-only:
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse/native:/run/pulse/native:ro

    # publish the raw‑PCM TCP port:
    ports:
      - "1234:1234"

    environment:
      # tell all clients where the socket lives:
      PULSE_SERVER: unix:/run/pulse/native

      # pick up the discovered mic source:
      SOURCE: "alsa_input.usb-AKM_AK5370-00.mono-fallback" #${PULSE_SOURCE}

      # for faster data ingestion
      PULSE_LATENCY_MSEC: "20"

    # on startup, stream your mic out on TCP 1234
    command: >
       sh -c "parec --format=s16le --rate=16000 --channels=1 --device=$$SOURCE |
             socat -u - TCP-LISTEN:1234,reuseaddr,fork"

  # patient monitor ECG signal (replay)
  pm-signal:
    container_name: pm-signal
    build:
      context: patient-monitor/replay
      #image: patientMonitorReplay

