query: |
  SELECT * FROM mqtt_source INTO mqtt_sink

sink:
  name: mqtt_sink
  type: MQTT
  config:
    inputFormat: CSV
    serverURI: "tcp://mosquitto:1883"
    clientId: "patient_monitor_sink"
    topic: "test/topic"
    qos: 0

#sink:
#  name: mqtt_sink
#  type: File
#  config:
#    inputFormat: CSV
#    filePath: "test-mqtt.csv"
#    append: false

logical:
  - name: mqtt_source
    schema:
      - name: ts
        type: UINT64
      - name: value
        type: UINT64

physical:
  - logical: mqtt_source
    parserConfig:
      type: CSV
      tupleDelimiter: "\n"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: "tcp://mosquitto:1883"
      clientId: "patient_monitor_source"
      topic: "patientMonitor/SPO2"
      #topic: "$SYS/#"
      qos: 0
