  period: 0.3 # seconds between publishes
  start_epoch: 1735772400000000 # reference timestamp (in microseconds) so generators are in sync
  full_cycle_duration: 10 # in seconds
  heart_rates: [ 80, 115 ] # normal and sick state
  init_phase_duration: 3 # seconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration: 2 # seconds time for linear change from normal to sick state
