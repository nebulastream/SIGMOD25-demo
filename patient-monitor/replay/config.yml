ecg:
  broker: mosquitto
  port: 1883
  topic: patientMonitor/ECG
  period: 10 # milliseconds between publishes
abp:
  broker: mosquitto
  port: 1883
  topic: patientMonitor/ABP
  period: 10 # milliseconds between publishes
ppg:
  broker: mosquitto
  port: 1883
  topic: patientMonitor/PPG
  period: 10 # milliseconds between publishes
spo2_ards:
  broker: mosquitto
  port: 1883
  topic: patientMonitorReplay/SPO2/ards
  period: 300_000 # microseconds between publishes
  start_epoch: 1735772400000000   # reference timestamp in microseconds so generators are in sync
  full_cycle_duration: 10_000_000 # in microseconds
  spo2_values: [ 99, 89 ] # normal and sick state
  init_phase_duration: 3_000_000 # microseconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration: 2_000_000 # microseconds time for linear change from normal to sick state
spo2_hpss:
  broker: mosquitto
  port: 1883
  topic: patientMonitorReplay/SPO2/hpss
  period: 300_000 # microseconds between publishes
  start_epoch: 1735772400000000   # reference timestamp in microseconds so generators are in sync
  full_cycle_duration: 10_000_000 # in microseconds
  spo2_values: [ 98, 90 ] # normal and sick state
  init_phase_duration: 3_000_000 # microseconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration: 2_000_000 # microseconds time for linear change from normal to sick state
hr_ards:
  broker: mosquitto
  port: 1883
  topic: patientMonitorReplay/HR/ards
  period: 300_000 # microseconds between publishes
  start_epoch: 1735772400000000 # reference timestamp in microseconds so generators are in sync
  full_cycle_duration: 10_000_000 # in microseconds
  heart_rates: [ 80, 120 ] # normal and sick state
  init_phase_duration: 3_000_000 # microseconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration : 2_000_000 # microseconds time for linear change from normal to sick state
hr_hpss:
  broker: mosquitto
  port: 1883
  topic: patientMonitorReplay/HR/hpss
  period: 300_000 # microseconds between publishes
  start_epoch: 1735772400000000 # reference timestamp in microseconds so generators are in sync
  full_cycle_duration: 10_000_000 # in microseconds
  heart_rates: [ 80, 115 ] # normal and sick state
  init_phase_duration: 3_000_000 # microseconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration: 2_000_000 # microseconds time for linear change from normal to sick state
