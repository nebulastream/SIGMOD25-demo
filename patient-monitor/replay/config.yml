ecg:
  broker: mosquitto
  port: 1883
  topic: patientMonitor/ECG
  period: 10 # milliseconds between publishes
abp:
  broker: mosquitto
  port: 1883
  topic: patientMonitor/ABP
  period: 10 # milliseconds between publishes
ppg:
  broker: mosquitto
  port: 1883
  topic: patientMonitor/PPG
  period: 10 # milliseconds between publishes
spo2_ards:
  broker: mosquitto
  port: 1883
  topic: patientMonitorReplay/SPO2/ards
  period: 0.3 # seconds between publishes
  start_epoch: 1735772400000000   # reference timestamp (in microseconds) so generators are in sync
  full_cycle_duration: 10 # in seconds
  spo2_values: [ 99, 89 ] # normal and sick state
  init_phase_duration: 3 # seconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration: 2 # seconds time for linear change from normal to sick state
spo2_hpss:
  broker: mosquitto
  port: 1883
  topic: patientMonitorReplay/SPO2/hpss
  period: 0.3 # seconds between publishes
  start_epoch: 1735772400000000   # reference timestamp (in microseconds) so generators are in sync
  full_cycle_duration: 10 # in seconds
  spo2_values: [ 98, 90 ] # normal and sick state
  init_phase_duration: 3 # seconds time for how long the normal value will be held until the phase-over starts
  phase_over_duration: 2 # seconds time for linear change from normal to sick state
