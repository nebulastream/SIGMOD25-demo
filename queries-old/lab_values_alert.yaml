query: |
  SELECT UINT32(3) AS alertType, timestamp, value FROM mqtt_source WHERE value > FLOAT64(7.5) INTO alert_sink
sink:
  name: alert_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://192.168.1.104:1883
    clientId: lab-values-alert
    topic: alert
    qos: 0
logical:
  - name: mqtt_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: mqtt_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/lab_values
      qos: 0