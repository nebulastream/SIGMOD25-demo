query: |
  SELECT * FROM tcp_source INTO csv_sink
sink:
  name: csv_sink
  type: File
  config:
    inputFormat: CSV
    filePath: "audio.csv"
    append: true
logical:
  - name: tcp_source
    schema:
      - name: value
        type: UINT8
physical:
  - logical: tcp_source
    parserConfig:
      type: CSV
      tupleDelimiter: "\n"
      fieldDelimiter: ","
    sourceConfig:
      type: TCP
      socketDomain: AF_INET
      socketType: SOCK_STREAM
      socketPort: 22346
      socketHost: host.docker.internal
      socketBufferSize: 4
      flushIntervalMS: 100
      connectTimeoutSeconds: 60
