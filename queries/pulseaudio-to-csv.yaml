query: |
  SELECT * FROM tcp_source INTO csv_sink
sink:
  name: csv_sink
  type: File
  config:
    inputFormat: CSV
    filePath: "audio.csv"
    append: true
logical:
  - name: tcp_source
    schema:
      - name: value
        type: UINT8
physical:
  - logical: tcp_source
    parserConfig:
      type: Internal
      hasSpanningTuples: false
    sourceConfig:
      type: TCP
      socketDomain: AF_INET
      socketType: SOCK_STREAM
      socketPort: 22345
      socketHost: pulseaudio-simple-tcp
      socketBufferSize: 4
      flushIntervalMS: 100
      connectTimeoutSeconds: 60
