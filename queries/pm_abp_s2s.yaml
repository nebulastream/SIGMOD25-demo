query: |
  SELECT * FROM pm_abp_source INTO pm_abp_sink
sink:
  name: pm_abp_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://mosquitto:1883
    clientId: client_pm_source_abp
    topic: sink/patient_monitor_abp
    qos: 0
logical:
  - name: pm_abp_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: pm_abp_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://mosquitto:1883
      clientId: client_abp_patient_monitor
      topic: patientMonitor/ABP
      qos: 0