query: |
  SELECT * FROM spo2_source INTO spo2_sink

sink:
  name: spo2_sink
  type: MQTT
  config:
    inputFormat: CSV
    serverURI: "mqtt://mosquitto:1883"
    clientId: "patient_monitor_sink"
    topic: "sink/spo2"
    qos: 0

#sink:
#  name: spo2_sink
#  type: File
#  config:
#    inputFormat: CSV
#    filePath: "sink-spo2.csv"
#    append: false

logical:
  - name: spo2_source
    schema:
      - name: ts_spo2
        type: FLOAT64
      - name: value_spo2
        type: UINT64
physical:
  - logical: spo2_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://mosquitto:1883
      clientId: patient_monitor_source
      topic: patientMonitor/SPO2
      qos: 0
