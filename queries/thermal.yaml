# PixelFormat is based on aravis `arvenum.h`
# 0x01100007 (17825799) represents MONO16 (gray)
# 0x2100032 (34603058) represents YUV_422_YUYV (color)
query: |
  SELECT
    timestamp,
    ImageManipMono16MIN(image) as min_value,
    ImageManipMono16Max(image) as max_value,
    ImageManipToBase64(ImageManipMono8ToJPG(ImageManipMono16ToMono8(image, width, height, min_value, max_value), width, height)) as image  
  FROM video
  WHERE 
    pixelFormat == UINT64(17825799) 
  INTO mqtt
sink:
  name: mqtt
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://192.168.1.102:1883
    clientId: thermal
    topic: test/thermal-image
    qos: 1
logical:
  - name: video
    schema:
      - name: timestamp
        type: UINT64
      - name: width
        type: UINT64
      - name: height
        type: UINT64
      - name: pixelFormat
        type: UINT64
      - name: image
        type: VARSIZED
  - name: video_playback
    schema:
      - name: timestamp
        type: UINT64
      - name: width
        type: UINT64
      - name: height
        type: UINT64
      - name: pixelFormat
        type: UINT64
      - name: image
        type: VARSIZED
physical:
  - logical: video
    parserConfig:
      type: Raw
    sourceConfig:
      type: Video
      sourceSelector: 2
  - logical: video_playback
    parserConfig:
      type: Raw
    sourceConfig:
      type: MQTTVideoPlayback
      serverURI: mqtt://192.168.1.102:1883
      clientId: playback-read-client
      topic: test/serializer-image
      flushIntervalMS: 50
      qos: 1
