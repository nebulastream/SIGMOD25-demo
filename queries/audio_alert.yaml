query: |
  SELECT * FROM (
  SELECT id, alertType, timestamp
  FROM (
  SELECT UINT32(1) AS alertType, start as timestamp, UINT32(1) AS id
  FROM (
  SELECT start, end, label, COUNT(label) as freq
    FROM (
      SELECT start, end, label
      FROM (
        SELECT start, end, SpeechRecognitionLabel(ArgMax(output)) as label, MaxValue(output), INFER_MODEL(speech_recognition, (chunked))
        FROM (
          SELECT COUNT(value) as samples, MERGE(value) as chunked
          FROM audio_stream WINDOW SLIDING(timestamp, size 1000000 ms, advance by 20000 ms)
        )
      )
    WHERE label = VARSIZED("nine")
    )
  WINDOW TUMBLING(start, size 1000000 ms)
  HAVING freq > UINT32(15)
  )
  )
  INNER JOIN (
  SELECT id2, value2, timestamp
  FROM (
  SELECT value2, timestamp, UINT32(1) as id2
  FROM mqtt_source
  WHERE value2 > FLOAT32(5.0)
  )
  ) ON id = id2
  WINDOW TUMBLING (timestamp, size 2000000 ms)
  )
  INTO csv_sink
sink:
  name: csv_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://mosquitto:1883
    clientId: iamaclient3
    topic: alert
    qos: 1
logical:
  - name: audio_stream
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT32
  - name: mqtt_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value2
        type: FLOAT64
physical:
  - logical: audio_stream
    parserConfig:
      type: Raw
    sourceConfig:
      type: Audio
      socketPort: 1234
      socketHost: mic-stream
      sampleRate: 16000
      sampleWidth: 2
  - logical: mqtt_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://mosquitto:1883
      clientId: client_one_alert
      topic: source/lab_values
      qos: 0
models:
  - path: model/audio_model.onnx
#  - path: /model/audio_model.onnx
    name: speech_recognition
    inputs:
      - VARSIZED
    outputs:
      - name: output
        type: VARSIZED