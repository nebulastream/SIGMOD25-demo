query: |
  SELECT
    start as bp_timestamp,
    start as timestamp
  FROM (
    SELECT
      *
    FROM (
      SELECT UINT32(1) AS bpid, value as bp_value, timestamp
      FROM sysbp
    ) INNER JOIN (
      SELECT UINT32(1) AS hrid, value as hr_value, timestamp
      FROM hr
    ) 
      ON bpid = hrid 
      WINDOW TUMBLING(timestamp, size 500000 ms)
  )
  WHERE hr_value / bp_value > FLOAT32(1) 
  INTO sink
sink:
  name: sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://192.168.1.104:1883
    clientId: partial_shock_client2
    topic: sink/live/alert
    qos: 1
logical:
  - name: sysbp
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
  - name: hr
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
  - name: video
    schema:
      - name: timestamp
        type: UINT64
      - name: width
        type: UINT64
      - name: height
        type: UINT64
      - name: pixelFormat
        type: UINT64
      - name: image
        type: VARSIZED
physical:
  - logical: sysbp
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/live/patient_monitor_abp_values
      qos: 1
  - logical: hr
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/live/patient_monitor_ecg_values
      qos: 1
  - logical: video
    parserConfig:
      type: Raw
    sourceConfig:
      type: Video
      sourceSelector: 2
