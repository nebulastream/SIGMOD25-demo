# Regarding Magic Numbers:
# PixelFormat is based on aravis `arvenum.h`
# 0x01100007 (17825799) represents MONO16 (gray)
# 0x2100032 (34603058) represents YUV_422_YUYV (color)

# The following query aligns the RGB and Thermal stream into a single stream. Using the interleaved mode of the Video
# stream, we receive around 18FPS of the RGB and 9 FPS of Thermal.
# Based on the RGB images, we do face detection and use the returned rectangle to calculate an average temperature.
# The demo query down samples both streams to 4 FPS and joins the last received frame within that window to the other video stream.
# The result is a tuple which contains both and rgb and a thermal image.
# The rgb image is used for face detection which creates a rectangle which is used to find the maximum temperature value in the thermal image.
# Images are send to mqtt, by converting them to JPG (for rgb) or PNG-16 (for thermal) and encoding them into base64 (which is displayed in the webui)
# The demo also demonstrates how to integrate third party libraries into nebulastream. The ImageManip plugin implements
# thin wrappers around opencv functions (color space transformations, encoding, facedetection).
# The query uses a source sharing approach which enables multiple queries to consume from the same source. This is especially
# important for the video stream received from the camera which would saturate the 1GB network with around 3 clients.
# Other video related demo queries show partial results:
# - rgb-facedetect-to-mqtt just renders a bounding box around a single face and emits the image to mqtt.
# - thermal-to-mqtt gives thermal images received from the camera
# - record-video directly writes each frame to mqtt without further processing.
# All queries have an additional video_playback source which fetches the video stream from mqtt (create via the record-video query).
# There is currently a workaround nes assumption of millisecond timestamps, which leads to window sizes of 250000000ms (which represents 0.25s)
query: |
  SELECT
    timestamp,
    UINT32(5) as alertType
  FROM (
    SELECT *
    FROM (
      SELECT
        start / UINT64(1000) as temp_timestamp,
        start / UINT64(1000) as timestamp
      FROM (
            SELECT 
              ts
            FROM
            (
              SELECT
                end as ts, timestamp as ots, width as thermal_width, height as thermal_height, image as thermal
              FROM(
                SELECT 
                  LAST(image) as image, LAST(width) as width, LAST(height) as height, LAST(timestamp) as timestamp, LAST(pixelFormat) as pf
                FROM(
                  SELECT 
                    image,
                    width,
                    height,
                    timestamp,
                    pixelFormat
                  FROM video
                  WHERE 
                    pixelFormat == UINT64(17825799) 
                ) WINDOW TUMBLING(timestamp, size 250000000 ms)
              )
          ) INNER JOIN (
            SELECT
              end, timestamp as ots, width, height, image as rgb
            FROM(
              SELECT 
                LAST(image) as image, LAST(width) as width, LAST(height) as height, LAST(timestamp) as timestamp, LAST(pixelFormat) as pf
              FROM(
                SELECT 
                  image,
                  width,
                  height,
                  timestamp,
                  pixelFormat
                FROM video
                WHERE 
                  pixelFormat == UINT64(34603058) 
              ) WINDOW TUMBLING(timestamp, size 250000000 ms)
            )
          ) ON ts = end WINDOW TUMBLING (ots, size 250000000 ms)
        WHERE ImageManipMono16ToCelsius(ImageManipMono16MAX(ImageManipMono16ROI(thermal, thermal_width, thermal_height, ImageManipFaceDetection(rgb, width, height)))) > FLOAT32(42)
      )
    ) INNER JOIN (
      SELECT
        start as bp_timestamp,
        start as timestamp
      FROM (
        SELECT
          *
        FROM (
          SELECT UINT32(1) AS bpid, value as bp_value, timestamp
          FROM sysbp
        ) INNER JOIN (
          SELECT UINT32(1) AS hrid, value as hr_value, timestamp
          FROM hr
        ) 
          ON bpid = hrid 
          WINDOW TUMBLING(timestamp, size 500000 ms)
      )
      WHERE hr_value / bp_value > FLOAT32(1) 
    ) ON temp_timestamp = bp_timestamp
      WINDOW TUMBLING(timestamp, size 1000000 ms)
  )
  INTO mqtt
sink:
  name: mqtt
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://192.168.1.104:1883
    clientId: show-warning-client
    topic: sink/live/alert
    outOfOrderPolicy: ENFORCE
    qos: 1
logical:
  - name: video
    schema:
      - name: timestamp
        type: UINT64
      - name: width
        type: UINT64
      - name: height
        type: UINT64
      - name: pixelFormat
        type: UINT64
      - name: image
        type: VARSIZED
  - name: sysbp
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT32
  - name: hr
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
  - name: video_playback
    schema:
      - name: timestamp
        type: UINT64
      - name: width
        type: UINT64
      - name: height
        type: UINT64
      - name: pixelFormat
        type: UINT64
      - name: image
        type: VARSIZED
physical:
  - logical: video
    parserConfig:
      type: Raw
    sourceConfig:
      type: Video
      sourceSelector: 2
  - logical: sysbp
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/live/patient_monitor_abp_values
      qos: 0
  - logical: hr
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/live/patient_monitor_ecg_values
      qos: 1
  - logical: video_playback
    parserConfig:
      type: Raw
    sourceConfig:
      type: MQTTVideoPlayback
      serverURI: mqtt://192.168.1.104:1883
      clientId: playback-read-client
      topic: test/serializer-image
      flushIntervalMS: 50
      qos: 1
