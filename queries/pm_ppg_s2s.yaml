query: |
  SELECT * FROM pm_ppg_source INTO pm_ppg_sink
sink:
  name: pm_ppg_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://mosquitto:1883
    clientId: client_pm_source_ppg
    topic: sink/patient_monitor_ppg
    qos: 0
logical:
  - name: pm_ppg_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: pm_ppg_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://mosquitto:1883
      clientId: client_ppg_patient_monitor
      topic: patientMonitor/PPG
      qos: 0