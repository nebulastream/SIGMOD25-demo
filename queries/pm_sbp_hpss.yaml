query: |
  SELECT * FROM pm_sbp_hpss_source INTO pm_sbp_hpss_sink
sink:
  name: pm_sbp_hpss_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://192.168.1.104:1883
    topic: sink/live/patient_monitor_abp_values
    qos: 1
logical:
  - name: pm_sbp_hpss_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: pm_sbp_hpss_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/live/patient_monitor_abp_values
      qos: 1
