query: |
  SELECT * FROM pm_spo2_ards_source INTO pm_spo2_ards_sink
sink:
  name: pm_spo2_ards_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://mosquitto:1883
    clientId: client_pm_spo2_ards_sink
    topic: sink/patient_monitor_spo2_ards_sink
    qos: 0
logical:
  - name: pm_spo2_ards_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: pm_spo2_ards_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://mosquitto:1883
      clientId: client_pm_spo2_ards_source
      topic: patientMonitorReplay/SPO2/ards
      qos: 0