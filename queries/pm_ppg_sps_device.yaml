query: |
  SELECT * FROM pm_spo2_ards_source INTO pm_spo2_ards_sink
sink:
  name: pm_spo2_ards_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://192.168.1.104:1883
    topic: sink/live/patient_monitor_ppg_values
    qos: 0
logical:
  - name: pm_spo2_ards_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: pm_spo2_ards_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://192.168.1.104:1883
      topic: source/device/patient_monitor_ppg_values/PLS
      qos: 0
