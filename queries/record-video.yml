query: |
  SELECT 
    timestamp,
    width,
    height,
    pixelFormat,
    ImageManipSerialize(image, width, height, pixelFormat) as image
  FROM video 
  INTO mqtt
sink:
  name: mqtt
  type: MQTT
  config:
    inputFormat: CSV
    serverURI: mqtt://192.168.1.102:1883
    clientId: record-video
    topic: test/serializer-image
    qos: 1
logical:
  - name: video
    schema:
      - name: timestamp
        type: UINT64
      - name: width
        type: UINT64
      - name: height
        type: UINT64
      - name: pixelFormat
        type: UINT64
      - name: image
        type: VARSIZED
physical:
  - logical: video
    parserConfig:
      type: Raw
    sourceConfig:
      type: Video
      sourceSelector: 2
