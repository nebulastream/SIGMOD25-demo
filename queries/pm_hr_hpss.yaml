query: |
  SELECT * FROM pm_hr_hpss_source INTO pm_hr_hpss_sink
sink:
  name: pm_hr_hpss_sink
  type: MQTT
  config:
    inputFormat: JSON
    serverURI: mqtt://mosquitto:1883
    clientId: client_pm_hr_hpss_sink
    topic: sink/patient_monitor_hr_hpss_sink
    qos: 0
logical:
  - name: pm_hr_hpss_source
    schema:
      - name: timestamp
        type: UINT64
      - name: value
        type: FLOAT64
physical:
  - logical: pm_hr_hpss_source
    parserConfig:
      type: CSV
      tupleDelimiter: "|"
      fieldDelimiter: ","
    sourceConfig:
      type: MQTT
      serverURI: mqtt://mosquitto:1883
      clientId: client_pm_hr_hpss_source
      topic: patientMonitorReplay/HR/hpss
      qos: 0