services:

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - 8080:8080
    healthcheck:
      test: lsof -i:8080 | grep 'LISTEN'
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 5s

  audio-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - 5555:5555
    devices:
      - "/dev/snd:/dev/snd"
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true

  audio-query:
    image: nebulastream/nebuli:audio-inference
    entrypoint: ["bash", "-c", "nes-nebuli register -x -s worker:8080 -i query.yaml"]
    volumes:
      - type: bind
        source: ./queries/speech_recognition_audio.yaml
        target: /query.yaml
        read_only: true
      - type: bind
        source: ./data/audio_model.onnx
        target: /audio_model.onnx
        read_only: true
    depends_on:
      worker:
        condition: service_healthy
        restart: true
      audio-server:
        condition: service_started

  
