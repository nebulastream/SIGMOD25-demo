services:
  worker:
    build: ./worker
    #    links: 
    #      - pulseaudio-simple-tcp:pulseaudio
    ports:
      - 8080:8080
      - 22346:22346
    healthcheck:
      test: lsof -i:8080 | grep 'LISTEN'
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 5s
#  pulseaudio-simple-tcp:
#    build: nebulastream/pulseaudio-simple-tcp-server
#    ports: 
#      - "22345:22345"
#      - "4711:4713"
  audio-query:
    image: nebulastream/nebuli:main
    entrypoint: ["bash", "-c", "nes-nebuli register -x -s worker:8080 -i query.yaml"]
    volumes:
      - type: bind
        source: ./queries/pulseaudio-to-csv.yaml
        target: /query.yaml
        read_only: true
    depends_on:
      worker:
        condition: service_healthy
        restart: true

  
