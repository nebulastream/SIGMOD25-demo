services:

  worker:
    build: ./worker
    ports:
      - 8080:8080
    healthcheck:
      test: lsof -i:8080 | grep 'LISTEN'
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 5s

  pulseaudio-simple-tcp:
    image: nebulastream/pulseaudio-simple-tcp-server:0.0.0
    environment:
      - PULSE_COOKIE=${PULSE_COOKIE?PULSE_COOKIE is needed to authenticate with the server providing an audio source} # forces warning if not set
      - SOURCE_HOST=host.docker.internal
      - SOURCE_PORT=4713
    volumes:
      - type: bind
        source: "${PULSE_COOKIE}"
        target: /var/run/pulse/.config/pulse/cookie
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 22345:22345

  unpacked-audio:
    build: ./audioformatter
    ports:
      - 22346:22346
    environment:
      - SOURCE_HOST=pulseaudio-simple-tcp
      - SOURCE_PORT=22345
      - SINK_PORT=22346
    depends_on:
      - pulseaudio-simple-tcp

  audio-query:
    image: nebulastream/nebuli:main
    entrypoint: ["bash", "-c", "nes-nebuli register -x -s worker:8080 -i query.yaml"]
    volumes:
      - type: bind
        source: ./queries/pulseaudio-to-csv.yaml
        target: /query.yaml
        read_only: true
    depends_on:
      worker:
        condition: service_healthy
        restart: true
      unpacked-audio:
        condition: service_started

  
